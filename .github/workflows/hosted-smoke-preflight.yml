name: Hosted smoke preflight
on:
  push:
    branches: [test/hosted-wildcard-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only DNS and TLS access preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMOKE_ZONE_ID: ${{ vars.SMOKE_ZONE_ID }}
        run: node scripts/hosted-smoke-preflight.mjs
